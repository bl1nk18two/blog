{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <a href="{% url 'portal_do_autor' %}" class="btn btn-outline-primary mb-3 ">
        <i class="bi bi-arrow-left"></i> Portal do Autor
    </a>
    <div class="card p-4 shadow-lg">
        <h2 class="mb-4">Criar Novo Artigo</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="title" class="form-label">Título</label>
                <input type="text" class="form-control" id="title" name="title" value="" required>
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">Conteúdo</label>
                <textarea class="form-control" id="content" name="content" rows="15" required></textarea>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label">Categoria</label>
                <select class="form-select" id="subject" name="subject" required>
                    <option value="" disabled selected>Selecione uma Categoria...</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Imagem de Capa Atual</label><br>
                <input class="form-control" type="file" name="thumb_image" onchange="previewThumbImage(event)">
                <img id="previewImage" class="rounded border mb-2" style="max-height: 280px;" />
                <br>
                <button type="button" id="removeImageBtn" class="btn btn-sm btn-outline-danger mt-2" 
                        onclick="clearThumbImage()" style="display: none;">
                    <i class="bi bi-trash"></i> Remover Imagem
                </button>
            </div>

            <script>
                function previewThumbImage(event) {
                    const file = event.target.files[0];
                    const preview = document.getElementById('previewImage');
                    
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            preview.src = e.target.result;
                        }
                        reader.readAsDataURL(file);
                    }
                }
            </script>      
            
            <script>
                // Verificar se uma imagem já existe ao carregar a página
                document.addEventListener('DOMContentLoaded', function() {
                    const previewImage = document.getElementById('previewImage');
                    const removeBtn = document.getElementById('removeImageBtn');
                    
                    // Se a imagem tem uma fonte (já existe uma imagem)
                    if (previewImage.src && previewImage.src !== window.location.href) {
                        removeBtn.style.display = 'inline-block';
                    }
                });
            
                // Função para exibir prévia da imagem
                function previewThumbImage(event) {
                    const previewImage = document.getElementById('previewImage');
                    const removeBtn = document.getElementById('removeImageBtn');
                    
                    if (event.target.files && event.target.files[0]) {
                        const reader = new FileReader();
                        
                        reader.onload = function(e) {
                            previewImage.src = e.target.result;
                            removeBtn.style.display = 'inline-block'; // Mostrar botão quando uma imagem é selecionada
                        }
                        
                        reader.readAsDataURL(event.target.files[0]);
                    }
                }
                
                // Função para limpar a imagem
                function clearThumbImage() {
                    const fileInput = document.querySelector('input[type="file"]');
                    const previewImage = document.getElementById('previewImage');
                    const removeBtn = document.getElementById('removeImageBtn');
                    
                    fileInput.value = '';
                    previewImage.src = '';
                    removeBtn.style.display = 'none';
                }
            </script>            

            <input type="hidden" name="author_id" value="{{ user.id }}">

            <button type="submit" class="btn btn-primary" onclick="return confirm('Tem certeza que deseja editar este artigo?');">Salvar Alterações</button>
            <a href="{% url 'meus_artigos' %}" class="btn btn-secondary" onclick="return confirm('Tem certeza que deseja descartar as alterações?');">Cancelar</a>
        </form>
    </div>
</div>


<!-- Bootstrap Icons (opcional, mas necessário para os ícones) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock content %}
