<!-- Sidebar -->
<nav class="col-lg-3">
    <div class="p-3 bg-light rounded">
        <h5 class="text-center">Categorias</h5>
        {% if categories %}
        <ul class="list-group">
            {% for category in categories %}
                <li class="list-group-item"><a href="{% url 'category' category.name %}" class="text-decoration-none">{{category.name}}</a></li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>

</nav>
