{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <a href="{% url 'meus_artigos' %}" class="btn btn-outline-primary mb-3 ">
        <i class="bi bi-arrow-left"></i> Meus Artigos
    </a>
    <div class="card p-4 shadow-lg">
        <h2 class="mb-4">Editar Artigo</h2>
        
        <!-- Formulário de edição -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="title" class="form-label">Título</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ record.title }}">
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">Conteúdo</label>
                <textarea class="form-control" id="content" name="content" rows="15">{{ record.article }}</textarea>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label">Categoria</label>
                <select class="form-select" id="subject" name="subject">
                    {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == record.subject_id.id %}selected{% endif %}>
                            {{ category.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Imagem de Capa Atual</label><br>
                <img src="{{ record.thumb_image }}" style="max-height: 280px;" id="previewImage" class="rounded border mb-2" alt="Imagem atual">
                <input class="form-control" type="file" name="thumb_image" onchange="previewThumbImage(event)">
            </div>

            <div class="d-flex">
                <button type="submit" class="btn btn-primary" onclick="return confirm('Tem certeza que deseja editar este artigo?');">Salvar Alterações</button>
                <a href="{% url 'meus_artigos' %}" class="btn btn-secondary ms-2" onclick="return confirm('Tem certeza que deseja descartar as alterações?');">Cancelar</a>
                
                <button type="button" class="btn btn-danger ms-2" onclick="if(confirm('Tem certeza que deseja apagar este artigo?')) { document.getElementById('deleteForm').submit(); }">Excluir Artigo</button>
            </div>
        </form>
        
        <form id="deleteForm" action="{% url 'record' record.id record.author_id.id record.subject_id.id %}" method="post" style="display: none;">
            {% csrf_token %}
            <!-- Script para confirmação antes de excluir -->
            <script>
                document.getElementById('deleteForm').onsubmit = function() {
                    return confirm('Tem certeza que deseja apagar este artigo?');
                }
            </script>
        </form>
    </div>
</div>

<script>
    function previewThumbImage(event) {
        const file = event.target.files[0];
        const preview = document.getElementById('previewImage');
        
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }
</script>

<!-- Bootstrap Icons (opcional, mas necessário para os ícones) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock content %}
